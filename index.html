<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingBayo Money Empire</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            max-width: 600px; 
            width: 100%; 
            background: linear-gradient(145deg, #111827, #1f2937); 
            padding: 40px 30px; 
            border-radius: 24px; 
            text-align: center; 
            border: 1px solid #374151; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); 
        }
        h1 { 
            color: #10b981; 
            font-size: 2.2rem; 
            margin-bottom: 12px; 
            letter-spacing: -0.5px; 
        }
        p { 
            color: #9ca3af; 
            font-size: 1.1rem; 
            line-height: 1.6; 
            margin-bottom: 30px; 
        }
        .status-badge { 
            display: inline-block; 
            margin: 0 auto 25px; 
            background-color: rgba(16, 185, 129, 0.1); 
            color: #34d399; 
            font-weight: 600; 
            padding: 6px 16px; 
            border-radius: 50px; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            border: 1px solid rgba(16, 185, 129, 0.2); 
        }
        .btn { 
            display: inline-block; 
            background-color: #10b981; 
            color: #0b0f19; 
            text-decoration: none; 
            font-weight: bold; 
            padding: 14px 35px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            width: 100%;
            max-width: 300px;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
            transition: all 0.2s ease; 
        }
        .btn:hover {
            background-color: #059669;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }
        .btn:active { 
            transform: scale(0.97); 
        }
        .footer { 
            font-size: 0.85rem; 
            color: #4b5563; 
            margin-top: 10px; 
            border-top: 1px solid #2d3748;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">Node Connection Active</div>
        <h1>KingBayo Money Empire</h1>
        <p>Your private open-weights AI assistant node has successfully configured, built, and deployed this portfolio asset entirely from local hardware infrastructure.</p>
        
        <!-- Live Clickable Interactive Button -->
        <a href="https://github.com" target="_blank" class="btn">Explore My Profile</a>
        
        <div class="footer">Decentralized AI System Workspace</div>
    </div>
</body>
</html>
