<!DOCTYPE html>
<html lang="en">
<head>

        .status-badge { display: inline-block; margin: 0 auto 25px; background-color: rgba(16, 185, 129, 0.1); color: #34d399; font-weight: 600; padding: 6px 16px; border-radius: 50px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .footer { font-size: 0.85rem; color: #4b5563; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">Node Connection Active</div>
